<!DOCTYPE html>
<html lang="en">
<head> 
    
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script> 
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
    <a-scene
        mindar-image="imageTargetSrc:./img/targets.mind"
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: true"
    >
    <a-assets>
    <video
        id="Video"
        src="./media/Laura-final.webm"
        loop
        
        playsinline
        webkit-playsinline
    ></video>

    <video
        id="Video2"
        src="./media/Lizeth-final.webm"
        loop
        
        playsinline
        webkit-playsinline
    ></video>

    <video
        id="Video3"
        src="./media/Valeria-final.webm"
        loop
        
        playsinline
        webkit-playsinline
    ></video>

    <video
        id="Video4"
        src="./media/Alejandra-final.webm"
        loop
        
        playsinline
        webkit-playsinline
    ></video>

    </a-assets>
        <a-camera position=" 0 0 0" look-controls="enabled: false" cursor="fuse:false; rayOrigin: mouse" raycaster="objects: .btn; near: 0.01; far: 20"></a-camera>
        <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model rotation="90 0 0 " position="0 0 0.5" scale="0.3 0.3 0.3" src="./model/CAPSULA.glb" animation="property: position; to: 0 0.1 0.1; dur: 1500; easing: easeInOutQuad; loop: false; dir: alternate">



        </a-gltf-model>      
        <a-plane id="screen"
            position="0 0.05 0.42"
            rotation="90 0 0"
            width="0.45"
            height="0.5"
            material="
            src: #Video;
            transparent: true;
            shader: flat;
            opacity: 1;
            "
        ></a-plane>


  


        </a-entity> 
    </a-scene>







    <style>
        .hud {
            position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 9999;
        }
        .hud button {
            padding: 10px 14px; border: 0; border-radius: 10px;
            font: 600 14px system-ui, sans-serif; color: #111;
            background: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.15);
        }
        .hud button.active { background: #00e0b8; }
        /* opcional: ocultar la HUD hasta que detecte la imagen */
        .hud.hidden { display: none; }
    </style>

    <div id="hud" class="hud hidden">
    <button id="b1" class="active">Video 1</button>
    <button id="b2">Video 2</button>
    <button id="b3">Video 3</button>
    <button id="b4">Video 4</button>
    </div>

    <script>
    const anchor = document.querySelector('[mindar-image-target]');
    const videoEl = document.getElementById('Video');

    anchor.addEventListener("targetFound", () => {
        
        videoEl.muted = false;   
        videoEl.play().catch(err => {
        console.warn("No se pudo reproducir automáticamente:", err);
        });
    });

    anchor.addEventListener("targetLost", () => {
        
        videoEl.pause();
        videoEl.currentTime = 0;
    });
    </script>

    <script>
    (() => {
    const hud = document.getElementById('hud');
    const screen = document.getElementById('screen');        //pantalla (el plano que muestra el video)  
    const anchor = document.querySelector('[mindar-image-target]');

    // videos existentes
    const v1 = document.getElementById('Video');
    const v2 = document.getElementById('Video2');
    const v3 = document.getElementById('Video3');
    const v4 = document.getElementById('Video4');
    const videos = [v1, v2, v3, v4];

    // botones HUD
    const b1 = document.getElementById('b1');
    const b2 = document.getElementById('b2');
    const b3 = document.getElementById('b3');
    const b4 = document.getElementById('b4');

    let targetVisible = false;
    let current = v1; // coincide con tu material inicial (#Video)

    // precalentar videos (silencio) para cambios instantáneos
    const warmup = v => { v.muted = true; v.play().catch(()=>{}); };
    const pauseAll = () => videos.forEach(v => { try{v.pause();}catch{} });
    const muteAll  = () => videos.forEach(v => v.muted = true);

    // al cargar la escena intenta precargar
    document.querySelector('a-scene').addEventListener('loaded', () => {
        videos.forEach(v => {
        v.setAttribute('playsinline',''); v.setAttribute('webkit-playsinline','');
        warmup(v);
        });
    });

    // cambio de video (boton HUD)
    const setVideo = (vid, whichBtn) => {
        if (current === vid) return;
        try { current.pause(); } catch {}
        current = vid;
        screen.setAttribute('material', 'src', `#${vid.id}`);

        // feedback visual del botón activo
        [b1,b2,b3].forEach(b => b.classList.toggle('active', b===whichBtn));

         vid.currentTime = 0;

        // si el target está visible, intenta con audio; si no, lo dejamos “caliente”
        if (targetVisible) playWithAudio(vid); else warmup(vid);
    };

    const playWithAudio = async (vid) => {
        muteAll();
        vid.muted = false;
        try { await vid.play(); }
        catch {
        // si el navegador exige interacción para audio
        const unlock = () => { vid.muted = false; vid.play().catch(()=>{}); window.removeEventListener('pointerdown', unlock); };
        window.addEventListener('pointerdown', unlock, { once:true });
        }
    };

    // eventos de los botones (click/touch)
    ['click','touchstart'].forEach(ev=>{
        b1.addEventListener(ev, ()=> setVideo(v1, b1), {passive:true});
        b2.addEventListener(ev, ()=> setVideo(v2, b2), {passive:true});
        b3.addEventListener(ev, ()=> setVideo(v3, b3), {passive:true});
        b4.addEventListener(ev, ()=> setVideo(v4, b4), {passive:true});
    });

    // mostrar/ocultar HUD según el target
    anchor.addEventListener('targetFound', () => {
        targetVisible = true;
        hud.classList.remove('hidden');
        playWithAudio(current);
    });
    anchor.addEventListener('targetLost', () => {
        targetVisible = false;
        hud.classList.add('hidden');
        pauseAll(); muteAll();
        videos.forEach(v => v.currentTime = 0);
    });

    // si cambias de pestaña: pausar/silenciar
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) { pauseAll(); muteAll(); }
    });
    })();
    </script>

</body>
</html>
